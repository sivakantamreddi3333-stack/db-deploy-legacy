
name: Deploy Code to Databricks Git Folder

on:
  push:
    branches:
      - main
    paths:
      - 'notebooks/**'
      - '.github/workflows/deploy-code.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-code:
    name: Sync Databricks Git Folder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Databricks authentication configured"

      - name: Update Databricks Git folder
        env:
          REPO_ID: ${{ secrets.DATABRICKS_REPO_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$REPO_ID" ]; then
            echo "DATABRICKS_REPO_ID secret is missing"
            exit 1
          fi

          databricks repos update "$REPO_ID" \
            --branch "$BRANCH"

      - name: Deployment completed
        run: echo "Code deployment completed successfully"
