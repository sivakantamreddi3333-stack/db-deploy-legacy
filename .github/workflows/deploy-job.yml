# GitHub Action 2: deploy the JOB to Databricks.
# Runs on every push to main that changes files under workflows/.
# Logic: look up a job in the workspace whose name matches the name in the
# JSON definition. If it exists -> `databricks jobs reset` (update in place,
# same job ID). If it does not exist -> `databricks jobs create`.

name: Deploy job to Databricks

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
  workflow_dispatch:

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  # Path of the Databricks Git folder (Repos) that mirrors this GitHub repo
  GIT_FOLDER_PATH: /Repos/sivaashok111@outlook.com/db-deploy-legacy
  # Job definition file (repo-relative) and the job name inside it
  JOB_DEFINITION: workflows/legacy_hello_job.json
  JOB_NAME: legacy-hello-job

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Render job definition (inject Git folder path)
        run: |
          jq --arg nb_path "$GIT_FOLDER_PATH/notebooks/hello_job_notebook" \
            '.tasks[0].notebook_task.notebook_path = $nb_path' \
            "$JOB_DEFINITION" > job-settings.json
          echo "Rendered job settings:"
          cat job-settings.json

      - name: Find existing job by name
        id: lookup
        run: |
          JOB_ID=""
          PAGE_TOKEN=""
          # Scan jobs page by page until we find one whose name matches
          while :; do
            if [ -n "$PAGE_TOKEN" ]; then
              RESPONSE=$(databricks jobs list --output json --page-token "$PAGE_TOKEN")
            else
              RESPONSE=$(databricks jobs list --output json)
            fi
            MATCH=$(echo "$RESPONSE" | jq -r --arg name "$JOB_NAME" \
              '.jobs[]? | select(.settings.name == $name) | .job_id' | head -n 1)
            if [ -n "$MATCH" ]; then
              JOB_ID="$MATCH"
              break
            fi
            PAGE_TOKEN=$(echo "$RESPONSE" | jq -r 'if .next_page_token then .next_page_token else empty end')
            [ -z "$PAGE_TOKEN" ] && break
          done
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$JOB_ID" ]; then
            echo "Job '$JOB_NAME' already exists (ID $JOB_ID) -> it will be UPDATED"
          else
            echo "Job '$JOB_NAME' not found -> it will be CREATED"
          fi

      - name: Update existing job (reset, keeps the same job ID)
        if: steps.lookup.outputs.job_id != ''
        run: |
          databricks jobs reset --job-id "${{ steps.lookup.outputs.job_id }}" --json-file job-settings.json
          echo "Updated job '$JOB_NAME' (ID ${{ steps.lookup.outputs.job_id }})"

      - name: Create new job
        if: steps.lookup.outputs.job_id == ''
        run: |
          databricks jobs create --json-file job-settings.json
          echo "Created job '$JOB_NAME'"
