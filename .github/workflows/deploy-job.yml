
name: Deploy Databricks Jobs

on:
  push:
    branches:
      - main
    paths:
      - 'workflows/**'
      - '.github/workflows/deploy-job.yml'
  workflow_dispatch:

jobs:
  deploy-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy jobs to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail

          # Check that job definition files exist
          shopt -s nullglob
          JOB_FILES=(workflows/*.json)

          if [ ${#JOB_FILES[@]} -eq 0 ]; then
            echo "No JSON job definitions found in workflows/"
            exit 1
          fi

          # Get existing jobs from Databricks
          echo "Getting existing Databricks jobs..."

          JOBS=$(curl -fsS \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/list?limit=100")

          # Process each job definition
          for JOB_FILE in "${JOB_FILES[@]}"; do

            JOB_NAME=$(jq -r '.name' "$JOB_FILE")

            echo "--------------------------------"
            echo "Processing: $JOB_NAME"

            # Find matching job in Databricks
            JOB_ID=$(echo "$JOBS" | jq -r \
              --arg name "$JOB_NAME" \
              '.jobs[]? | select(.settings.name == $name) | .job_id' | head -n 1)

            if [ -n "$JOB_ID" ]; then

              echo "Job exists. Updating job ID: $JOB_ID"

              # Update existing job
              jq -n \
                --argjson job_id "$JOB_ID" \
                --slurpfile settings "$JOB_FILE" \
                '{job_id: $job_id, new_settings: $settings[0]}' \
                > /tmp/reset-job.json

              curl -fsS -X POST \
                -H "Authorization: Bearer $DATABRICKS_TOKEN" \
                -H "Content-Type: application/json" \
                --data @/tmp/reset-job.json \
                "$DATABRICKS_HOST/api/2.1/jobs/reset"

              echo "Updated: $JOB_NAME"

            else

              echo "Job does not exist. Creating..."

              # Create new job
              curl -fsS -X POST \
                -H "Authorization: Bearer $DATABRICKS_TOKEN" \
                -H "Content-Type: application/json" \
                --data @"$JOB_FILE" \
                "$DATABRICKS_HOST/api/2.1/jobs/create"

              echo "Created: $JOB_NAME"

            fi

          done

          echo "Job deployment completed."
