
name: Deploy Databricks Job

on:
  push:
    branches:
      - main
    paths:
      - 'workflows/**'
      - '.github/workflows/deploy-job.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-job:
    name: Create or Update Databricks Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate job definition
        run: |
          jq -e '.name and .tasks' workflows/job.json > /dev/null

      - name: Create or Update Databricks Job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          JOB_NAME=$(jq -r '.name' workflows/job.json)

          echo "Checking job: $JOB_NAME"

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "$DATABRICKS_HOST/api/2.1/jobs/list?limit=100")

          JOB_ID=$(echo "$RESPONSE" | jq -r \
            --arg name "$JOB_NAME" \
            '[.jobs[]? | select(.settings.name == $name)] |
            first | .job_id // empty')

          if [ -n "$JOB_ID" ]; then
            echo "Existing job found: $JOB_ID"
            jq -n \
              --argjson job_id "$JOB_ID" \
              --slurpfile settings workflows/job.json \
              '{job_id: $job_id, new_settings: $settings[0]}' \
              > /tmp/reset-job.json

            curl --fail-with-body -sS -X POST \
              "$DATABRICKS_HOST/api/2.1/jobs/reset" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @/tmp/reset-job.json
          else
            echo "Job does not exist. Creating: $JOB_NAME"

            curl --fail-with-body -sS -X POST \
              "$DATABRICKS_HOST/api/2.1/jobs/create" \
              -H "Authorization: Bearer $DATABRICKS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @workflows/job.json
          fi

      - name: Deployment completed
        run: echo "Job deployment completed successfully"
